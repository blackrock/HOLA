[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "hola-opt"
version = "1.0.1-rc8"
description = "Lightweight asynchronous hyperparameter optimization backed by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
authors = [{ name = "BlackRock, Inc." }]
keywords = ["optimization", "hyperparameter-optimization", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/blackrock/HOLA"
Documentation = "https://github.com/blackrock/HOLA/blob/main/docs/python-guide.md"
Repository = "https://github.com/blackrock/HOLA"
Issues = "https://github.com/blackrock/HOLA/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
exclude = ["hola_opt/__pycache__", "hola_opt/**/*.pyc"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hola_opt"]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.22",
    "ty>=0.0.20",
]
docs = [
    "mkdocs-material>=9.7.7",
]
benchmarks = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
    "optuna>=4.9.0",
    "pymoo>=0.6.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "examples: example script smoke tests",
    "benchmarks: benchmark framework smoke tests",
    "doctest_md: documentation code block tests",
]
testpaths = ["tests"]

[tool.ty.rules]
# hola is a native PyO3 extension — only exists after `maturin develop`
unresolved-import = "ignore"

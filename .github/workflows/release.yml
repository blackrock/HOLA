name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version to verify from the exact main commit (without a leading v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate tag and package versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse origin/main)"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            version="${TAG_NAME#v}"
            if [[ "${TAG_NAME}" != v* || -z "${version}" || "${version}" == "${TAG_NAME}" ]]; then
              echo "Release tags must be named v<version>; got ${TAG_NAME}" >&2
              exit 1
            fi

            tag_sha="$(git rev-list -n 1 "${TAG_NAME}")"
            if [[ "${tag_sha}" != "${main_sha}" ]]; then
              echo "Release tag ${TAG_NAME} points to ${tag_sha}, but origin/main is ${main_sha}" >&2
              exit 1
            fi
          else
            version="${INPUT_VERSION}"
            if [[ -z "${version}" || "${version}" == v* ]]; then
              echo "The dry-run version must be a package version without a leading v; got ${version:-<empty>}" >&2
              exit 1
            fi
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Release dry runs must be dispatched from main; got ${GITHUB_REF}" >&2
              exit 1
            fi

            checkout_sha="$(git rev-parse HEAD)"
            if [[ "${checkout_sha}" != "${main_sha}" ]]; then
              echo "Release dry run checked out ${checkout_sha}, but origin/main is ${main_sha}" >&2
              exit 1
            fi
          fi

          TAG_VERSION="${version}" python <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = os.environ["TAG_VERSION"]
          errors: list[str] = []

          pyproject = tomllib.loads(Path("hola-py/pyproject.toml").read_text())
          if pyproject["project"]["version"] != version:
              errors.append(
                  f"hola-py/pyproject.toml project.version is {pyproject['project']['version']!r}, expected {version!r}"
              )

          manifests = [
              Path("opt_engine/Cargo.toml"),
              Path("hola/Cargo.toml"),
              Path("hola-py/Cargo.toml"),
              Path("hola-cli/Cargo.toml"),
          ]
          for manifest in manifests:
              data = tomllib.loads(manifest.read_text())
              package_version = data["package"]["version"]
              if package_version != version:
                  errors.append(f"{manifest} package.version is {package_version!r}, expected {version!r}")
              for section in ("dependencies", "dev-dependencies"):
                  for dep_name, dep in data.get(section, {}).items():
                      if isinstance(dep, dict) and "path" in dep and "version" in dep and dep["version"] != version:
                          errors.append(
                              f"{manifest} {section}.{dep_name}.version is {dep['version']!r}, expected {version!r}"
                          )
              for table, deps in data.items():
                  if not table.startswith("dev-dependencies."):
                      continue
                  if isinstance(deps, dict) and "path" in deps and "version" in deps and deps["version"] != version:
                      errors.append(f"{manifest} {table}.version is {deps['version']!r}, expected {version!r}")

          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Verify bundled dashboard assets
        run: |
          cmp dashboard/index.html hola-py/hola_opt/dashboard/index.html
          cmp dashboard/styles.css hola-py/hola_opt/dashboard/styles.css
          cmp dashboard/app.js hola-py/hola_opt/dashboard/app.js

  # ── Python wheels (abi3 — one per platform) ─────────────
  build-wheels:
    name: Wheel (${{ matrix.os }} ${{ matrix.target }})
    needs: [validate-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up QEMU
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Bundle dashboard into wheel
        shell: bash
        run: |
          mkdir -p hola-py/hola_opt/dashboard
          cp dashboard/index.html dashboard/styles.css dashboard/app.js hola-py/hola_opt/dashboard/

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.12.6"
          target: ${{ matrix.target }}
          args: --release --locked --out dist ${{ runner.os == 'Linux' && '-i python3.10' || '' }}
          manylinux: "2_28"
          working-directory: hola-py
          # ring (via rustls) needs __ARM_ARCH when cross-compiling aarch64 from x86 in manylinux Docker
          docker-options: ${{ matrix.target == 'aarch64' && runner.os == 'Linux' && '-e CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8' || '' }}

      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: hola-py/dist/*.whl

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: hola-py/dist/*.whl

  # ── Source distribution ─────────────────────────────────
  build-sdist:
    name: Source distribution
    needs: [validate-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.12.6"
          command: sdist
          # `maturin sdist` packages sources and does not build, so it rejects
          # the cargo `--locked` flag (unlike the wheel build below). The sdist
          # bundles Cargo.lock. Its generated workspace omits the unrelated
          # CLI member, so consumer Cargo may prune unused lock entries while
          # preserving every selected version needed by the Python build.
          args: --out dist
          working-directory: hola-py

      - name: Attest sdist provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: hola-py/dist/*.tar.gz

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: hola-py/dist/*.tar.gz

  # ── CLI binaries ────────────────────────────────────────
  build-cli:
    name: CLI (${{ matrix.target }})
    needs: [validate-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hola-linux-x86_64
            archive: hola-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: hola-linux-aarch64
            archive: hola-linux-aarch64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: hola-macos-x86_64
            archive: hola-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hola-macos-aarch64
            archive: hola-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hola-windows-x86_64.exe
            archive: hola-windows-x86_64.exe.zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        continue-on-error: true

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p hola-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8' || '' }}

      - name: Smoke CLI binary (Unix native targets)
        if: runner.os != 'Windows' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: target/${{ matrix.target }}/release/hola --help

      - name: Smoke CLI binary (Windows)
        if: runner.os == 'Windows'
        run: '& "target/${{ matrix.target }}/release/hola.exe" --help'

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/hola ${{ matrix.artifact }}
          tar czf ${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/hola.exe ${{ matrix.artifact }}
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ${{ matrix.archive }}

      - name: Attest CLI archive provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.artifact }}
          path: ${{ matrix.archive }}

  # Download and execute every packaged CLI on its native architecture. This
  # runs during the non-publishing dry run as well as the tagged release.
  test-cli:
    name: Test CLI archive (${{ matrix.target }})
    needs: [build-cli]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cli-hola-linux-x86_64
            archive: hola-linux-x86_64.tar.gz
            binary: hola-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: cli-hola-linux-aarch64
            archive: hola-linux-aarch64.tar.gz
            binary: hola-linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: cli-hola-macos-x86_64
            archive: hola-macos-x86_64.tar.gz
            binary: hola-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cli-hola-macos-aarch64
            archive: hola-macos-aarch64.tar.gz
            binary: hola-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cli-hola-windows-x86_64.exe
            archive: hola-windows-x86_64.exe.zip
            binary: hola-windows-x86_64.exe
    steps:
      - name: Download CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Extract and smoke CLI archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "dist/${{ matrix.archive }}" -C dist
          "dist/${{ matrix.binary }}" --help

      - name: Extract and smoke CLI archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "dist/${{ matrix.archive }}" -DestinationPath dist/unpacked
          & "dist/unpacked/${{ matrix.binary }}" --help

  # ── Wheel smoke test ────────────────────────────────────
  test-wheels:
    name: Test wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-24.04-arm
            python-version: "3.11"
          - os: macos-15-intel
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Install and test
        shell: bash
        run: |
          python -m pip install --upgrade pip==25.1.1 pytest==9.0.3 pytest-timeout==2.4.0
          python -m pip install hola-opt --no-index --find-links dist/
          python -c "from hola_opt import Study, Space, Real, Minimize; print('Import OK')"
          python -c "from hola_opt import dashboard_dir; assert dashboard_dir().exists(), 'Dashboard not bundled'"
          mkdir -p "$RUNNER_TEMP/hola-wheel-tests"
          cp hola-py/tests/conftest.py \
             hola-py/tests/test_exceptions.py \
             hola-py/tests/test_ffi_roundtrip.py \
             hola-py/tests/test_hola.py \
             hola-py/tests/test_remote_client_hardening.py \
             hola-py/tests/test_server.py \
             hola-py/tests/test_stubs.py \
             hola-py/tests/test_study_advanced.py \
             "$RUNNER_TEMP/hola-wheel-tests/"
          cd "$RUNNER_TEMP"
          python -m pytest hola-wheel-tests -q --timeout=120

  # ── Create GitHub Release ───────────────────────────────
  release:
    name: GitHub Release
    if: github.event_name == 'push'
    needs: [build-wheels, build-sdist, build-cli, test-cli, test-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  # ── Update PEP 503 package index on GitHub Pages ───────
  update-index:
    name: Update Package Index
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Generate PEP 503 simple index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Collect download URLs from stable releases. If no stable release
          # exists yet, index only the current tag so the index is never empty.
          gh release list --limit 1000 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == false) | .tagName' > /tmp/index_tags.txt
          if [[ ! -s /tmp/index_tags.txt ]]; then
            echo "${CURRENT_TAG}" > /tmp/index_tags.txt
          fi

          # Emit one JSON array of {name,url} per tag, then union them into a
          # single JSON array for the index builder (filtering/hashing/escaping
          # all happen in build_simple_index.py).
          while read -r tag; do
            gh release view "$tag" --json assets \
              --jq '[.assets[] | {name: .name, url: .url}]'
          done < /tmp/index_tags.txt \
            | python3 .github/scripts/build_simple_index.py

          cat index/simple/hola-opt/index.html

      - name: Verify generated index is installable
        run: |
          set -euo pipefail
          python3 -m venv /tmp/idxtest
          /tmp/idxtest/bin/python -m pip install --quiet --upgrade pip==25.1.1
          /tmp/idxtest/bin/python -m pip download --no-deps \
            --index-url "file://$PWD/index/simple/" hola-opt -d /tmp/idxdl

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./index/simple
          destination_dir: simple
          keep_files: true

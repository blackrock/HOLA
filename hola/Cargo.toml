[package]
name = "hola"
version = "1.0.1-rc8"
edition = "2024"
description = "Dynamic optimization engine and optional REST server for HOLA"
documentation = "https://docs.rs/hola"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
server = ["axum/http1", "axum/json", "axum/query", "axum/tokio", "tokio/net", "tokio/signal", "tokio-stream", "tower-http", "tracing"]

[dependencies]
opt_engine = { version = "1.0.1-rc8", path = "../opt_engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Core engine needs async locks and blocking refit tasks; server adds net support.
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }
rand = "0.9.3"
# Constant-time comparison for the server's bearer-token check (avoids timing side-channels).
constant_time_eq = "0.4"
tracing = { version = "0.1", optional = true }
axum = { version = "0.8", default-features = false, optional = true }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"], optional = true }
tower-http = { version = "0.6.8", default-features = false, features = ["cors", "fs", "request-id", "timeout", "trace"], optional = true }

[dev-dependencies]
opt_engine = { version = "1.0.1-rc8", path = "../opt_engine" }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"

# Enable server feature in tests so we can test the REST API
[dev-dependencies.hola]
path = "."
features = ["server"]
